<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironvale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #14171f;
  --panel: #1b1f2a;
  --panel-2: #21263340;
  --line: #333c4d;
  --ink: #d9d4c4;
  --ink-dim: #8b93a6;
  --ember: #c96a3a;
  --ember-bright: #e0834f;
  --gold: #c9a24a;
  --hp: #9a3a3a;
  --hp-bright: #c94f4f;
  --ok: #5f8a5a;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:.02em;}
button{font-family:inherit;cursor:pointer;}
#app{display:flex;min-height:100vh;max-width:1200px;margin:0 auto;}

/* ---- layout ---- */
.sidebar{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;}
.main{flex:1;padding:20px 24px;min-width:0;}
.rightbar{width:270px;flex:0 0 270px;background:var(--panel);border-left:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:14px;}

.brand{font-size:20px;font-weight:700;color:var(--ember-bright);border-bottom:1px solid var(--line);padding-bottom:12px;}
.brand small{display:block;font-family:'Inter';font-size:11px;color:var(--ink-dim);font-weight:400;letter-spacing:0;margin-top:3px;}

.navgroup-label{font-size:11px;color:var(--ink-dim);margin:10px 0 2px 4px;}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:1px solid transparent;color:var(--ink);padding:8px 10px;border-radius:var(--radius);font-size:14px;text-align:left;}
.navbtn:hover{background:#ffffff08;}
.navbtn.active{background:#ffffff0d;border-color:var(--line);color:var(--ember-bright);}
.navbtn .lvl{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
.navbtn.active .lvl{color:var(--gold);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.section-title{font-size:19px;margin:0 0 4px 0;}
.section-sub{color:var(--ink-dim);font-size:13px;margin:0 0 16px 0;}

/* progress */
.progress-outer{background:#ffffff10;border-radius:2px;height:8px;overflow:hidden;margin-top:6px;}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--ember),var(--ember-bright));transition:width .15s linear;}
.hpbar-outer{background:#00000040;border-radius:2px;height:10px;overflow:hidden;}
.hpbar-inner{height:100%;background:linear-gradient(90deg,var(--hp),var(--hp-bright));transition:width .2s linear;}

/* action list */
.action-list{display:flex;flex-direction:column;gap:8px;}
.action-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:#ffffff03;}
.action-row.locked{opacity:.42;}
.action-row.running{border-color:var(--ember);background:#c96a3a12;}
.action-name{font-weight:600;font-size:14px;}
.action-meta{color:var(--ink-dim);font-size:12px;margin-top:2px;}
.action-btn{background:var(--ember);border:none;color:#1b1305;font-weight:600;font-size:12px;padding:7px 14px;border-radius:var(--radius);}
.action-btn:disabled{background:#3a3f4c;color:#787f8f;cursor:not-allowed;}
.action-btn.stop{background:#3a3f4c;color:var(--ink);}

/* inventory */
.inv-grid{display:grid;grid-template-columns:1fr;gap:4px;max-height:230px;overflow-y:auto;padding-right:2px;}
.inv-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 6px;border-radius:2px;}
.inv-row:hover{background:#ffffff06;}
.inv-qty{color:var(--gold);font-variant-numeric:tabular-nums;}

.stat-line{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-dim);}
.stat-line b{color:var(--ink);font-weight:600;}

.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--ink-dim);margin-left:6px;}
.tag.melee{border-color:#7a4a3a;color:#d68a5f;}
.tag.ranged{border-color:#4a6a3a;color:#9fcf7f;}
.tag.magic{border-color:#3a4a7a;color:#8fa9f0;}

.equip-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);}
.equip-row:last-child{border-bottom:none;}
.equip-slot-name{color:var(--ink-dim);}
.equip-item-btn{background:none;border:1px solid var(--line);color:var(--ink);font-size:11px;padding:3px 8px;border-radius:2px;}
.equip-item-btn:hover{border-color:var(--ember);}

.log{font-size:12px;color:var(--ink-dim);max-height:130px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:3px;}
.log .entry.good{color:#9fcf7f;}
.log .entry.bad{color:#d68a5f;}
.log .entry.gold{color:var(--gold);}

.style-toggle{display:flex;gap:6px;margin-bottom:14px;}
.style-btn{flex:1;padding:9px 4px;border-radius:var(--radius);border:1px solid var(--line);background:#ffffff03;color:var(--ink-dim);font-size:13px;font-weight:600;}
.style-btn.active{border-color:var(--ember);color:var(--ember-bright);background:#c96a3a14;}

.zone-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.zone-tab{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--line);background:none;color:var(--ink-dim);font-size:12px;}
.zone-tab.active{border-color:var(--gold);color:var(--gold);}
.zone-tab.locked{opacity:.4;}

.monster-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:#ffffff03;display:flex;flex-direction:column;gap:8px;}
.monster-card.fighting{border-color:var(--hp-bright);background:#9a3a3a10;}
.weak-note{font-size:11px;color:var(--ink-dim);}
.weak-note b{color:var(--ember-bright);}

.combatant-hp{display:flex;flex-direction:column;gap:3px;font-size:12px;}

.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:900px){.shop-grid{grid-template-columns:1fr;}}
.shop-item{border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;}
.shop-item-name{font-weight:600;font-size:13px;}
.shop-item-price{color:var(--gold);font-size:12px;}
.small-btn{background:var(--ember);border:none;color:#1b1305;font-weight:600;font-size:12px;padding:6px 10px;border-radius:var(--radius);align-self:flex-start;}
.small-btn:disabled{background:#3a3f4c;color:#787f8f;}
.small-btn.sell{background:#3a3f4c;color:var(--ink);}

.notice{font-size:12px;color:var(--ink-dim);border:1px dashed var(--line);border-radius:var(--radius);padding:8px 10px;margin-bottom:12px;}
.notice.warn{border-color:var(--hp-bright);color:#d68a5f;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#3a3f4c;border-radius:3px;}
</style>
</head>

/* ---------- XP / leveling ---------- */
function xpReq(level){ // cumulative xp required to REACH this level
  if(level<=1) return 0;
  const l=level-1;
  return Math.floor(5*l*l+50*l);
}
const XP_TABLE=[]; for(let l=1;l<=99;l++) XP_TABLE.push(xpReq(l));
function levelFromXp(xp){
  let lvl=1;
  for(let l=99;l>=1;l--){ if(xp>=XP_TABLE[l-1]){lvl=l;break;} }
  return lvl;
}
function xpForNext(level){ return level>=99?null:XP_TABLE[level]; }

const state={

state.maxHp=50+levelFromXp(state.xp.hitpoints)*5;

function addLog(msg,cls){
  state.log.push({msg,cls:cls||''});
  if(state.log.length>60) state.log.shift();
}
addLog('You arrive in Ironvale with a few coins and a lot of ambition.','good');

function invAdd(id,qty){ state.inv[id]=(state.inv[id]||0)+qty; }
function invHas(id,qty){ return (state.inv[id]||0)>=qty; }
function invRemove(id,qty){ state.inv[id]=(state.inv[id]||0)-qty; if(state.inv[id]<=0) delete state.inv[id]; }

function skillLevel(skill){ return levelFromXp(state.xp[skill]); }

function addXp(skill,amount){
  const before=skillLevel(skill);
  state.xp[skill]+=amount;
  const after=skillLevel(skill);
  if(after>before){
    addLog(`Level up! ${cap(skill)} is now level ${after}.`,'good');
    if(skill!=='hitpoints'){
      const hpBefore=state.maxHp;
      state.maxHp=50+skillLevel('hitpoints')*5;
    }
  }
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function toolBonus(kind){
  const t=state.tools[kind]||0;
  if(t>=2) return 0.25;
  if(t>=1) return 0.10;
  return 0;
}

/* ============= GAME TICK ============= */
let lastTick=performance.now();
function gameTick(now){
  const dt=now-lastTick; lastTick=now;

  // stun overrides everything in the thieving loop
  if(state.action && state.action.type==='thieve' && now<state.stunUntil){
    render(); requestAnimationFrame(gameTick); return;
  }

  if(state.action){
    state.action.elapsed+=dt;
    const def=getActionDef(state.action);
    if(def && state.action.elapsed>=def.time){
      state.action.elapsed=0;
      resolveAction(state.action.type,def);
    }
  }

  if(state.monster){
    state.monster.elapsed=(state.monster.elapsed||0)+dt;
    if(state.monster.elapsed>=2000){
      state.monster.elapsed=0;
      combatRound();
    }
  }

  render();
  requestAnimationFrame(gameTick);
}

function getActionDef(action){
  if(action.type==='gather') return (action.skill==='fishing'?FISHING_SPOTS:MINING_NODES).find(a=>a.id===action.id);
  if(action.type==='cook') return COOK_RECIPES.find(a=>a.id===action.id);
  if(action.type==='smith') return SMITH_RECIPES.find(a=>a.id===action.id);
  if(action.type==='thieve') return THIEVE_TARGETS.find(a=>a.id===action.id);
  return null;
}

function resolveAction(type,def){
  if(type==='gather'){
    const skill=state.action.skill;
    const bonus=skill==='fishing'?toolBonus('fishing'):toolBonus('mining');
    let qty=1;
    if(Math.random()<0.10) qty=2;
    invAdd(def.item,qty);
    addXp(skill,def.xp);
    if(skill==='mining' && Math.random()<0.05){ invAdd('gem',1); addLog('You spot a gem in the rubble!','gold'); }
    if(qty===2) addLog(`Big catch! Got 2x ${ITEMS[def.item].name}.`,'good');
    // re-apply speed bonus by shrinking next cycle's effective time (handled in getActionDef consumer via time*factor) -- simplified: nothing else needed
  } else if(type==='cook'){
    if(!invHas(def.raw,1)){ addLog(`Out of ${ITEMS[def.raw].name}. Cooking stopped.`,'bad'); state.action=null; return; }
    invRemove(def.raw,1);
    const lvl=skillLevel('cooking');
    const burnChance=Math.max(0.05,0.35-lvl*0.004-toolBonus('cooking'));
    if(Math.random()<burnChance){
      invAdd('burnt_food',1);
      addXp('cooking',Math.floor(def.xp*0.2));
      addLog(`Burnt the ${ITEMS[def.raw].name.toLowerCase()}!`,'bad');
    } else {
      invAdd(def.cooked,1);
      addXp('cooking',def.xp);
    }
  } else if(type==='smith'){
    for(const [mat,qty] of Object.entries(def.cost)){
      if(!invHas(mat,qty)){ addLog(`Not enough ${ITEMS[mat].name} to continue. Smithing stopped.`,'bad'); state.action=null; return; }
    }
    for(const [mat,qty] of Object.entries(def.cost)) invRemove(mat,qty);
    invAdd(def.out,def.outQty);
    addXp('smithing',def.xp);
  } else if(type==='thieve'){
    const lvl=skillLevel('thieving');
    const stunChance=Math.max(0.05,def.stun-toolBonus('thieving'));
    if(Math.random()<stunChance){
      state.stunUntil=performance.now()+def.stunTime;
      addLog(`Caught! Stunned trying to rob the ${def.name}.`,'bad');
    } else {
      const gold=Math.floor(def.goldMin+Math.random()*(def.goldMax-def.goldMin));
      state.gold+=gold;
      addXp('thieving',def.xp);
      addLog(`Pickpocketed the ${def.name} for ${gold} gold.`,'gold');
    }
  }
}

/* ---- combat ---- */
function weaponFor(style){
  const w=state.equip.weapon;
  if(w && ITEMS[w].style===style) return ITEMS[w];
  return {dmg:style==='melee'?2:0,name:'Fists'};
}
function styleLevel(style){ return skillLevel(style); }

function combatRound(){
  const mon=state.monster;
  const style=state.combatStyle;
  const weapon=weaponFor(style);

  if(style==='ranged' || style==='magic'){
    const ammoId=state.equip.ammo;
    if(!ammoId || !invHas(ammoId,1)){
      addLog(`Out of ${style==='ranged'?'ammo':'runes'}! Combat paused.`,'bad');
      return;
    }
  }

  // player attacks
  const lvl=styleLevel(style);
  let dmg=weapon.dmg*(1+lvl/80);
  if(style==='ranged'||style==='magic'){
    const ammo=ITEMS[state.equip.ammo];
    dmg+=ammo.dmg*(1+lvl/100);
    invRemove(state.equip.ammo,1);
  }
  dmg*=0.8+Math.random()*0.4;
  dmg-=mon.def.def*0.3;
  if(mon.def.weak===style) dmg*=1.5;
  dmg=Math.max(1,Math.round(dmg));
  mon.curHp-=dmg;
  addLog(`You hit the ${mon.def.name} for ${dmg}.`,'');

  if(mon.curHp<=0){
    addXp(style,mon.def.xp);
    addXp('hitpoints',Math.floor(mon.def.xp/3));
    const gold=Math.floor(mon.def.goldMin+Math.random()*(mon.def.goldMax-mon.def.goldMin));
    state.gold+=gold;
    addLog(`Defeated the ${mon.def.name}! +${mon.def.xp} xp, +${gold} gold.`,'good');
    if(Math.random()<0.12){
      const drop=lootTableRoll();
      if(drop){ invAdd(drop,1); addLog(`Looted: ${ITEMS[drop].name}.`,'gold'); }
    }
    spawnMonster(mon.def);
    return;
  }

  // monster attacks back
  const mdmg=Math.max(1,Math.round(mon.def.atk*(0.8+Math.random()*0.4)));
  state.hp-=mdmg;
  addLog(`The ${mon.def.name} hits you for ${mdmg}.`,'bad');
  if(state.hp<=Math.floor(state.maxHp*0.3)) autoEat();
  if(state.hp<=0){
    state.hp=state.maxHp;
    state.monster=null;
    addLog(`You were knocked out and wake up back in town.`,'bad');
  }
}
function lootTableRoll(){
  const pool=['copper_ore','iron_ore','coal','raw_trout','gem'];
  return pool[Math.floor(Math.random()*pool.length)];
}
function autoEat(){
  const foods=Object.keys(ITEMS).filter(id=>ITEMS[id].heal && invHas(id,1));
  if(!foods.length) return;
  foods.sort((a,b)=>ITEMS[b].heal-ITEMS[a].heal);
  const f=foods[0];
  invRemove(f,1);
  state.hp=Math.min(state.maxHp,state.hp+ITEMS[f].heal);
  addLog(`Auto-ate ${ITEMS[f].name} (+${ITEMS[f].heal} HP).`,'good');
}
function spawnMonster(def){ state.monster={def,curHp:def.hp,elapsed:0}; }

/* ---------- actions from UI ---------- */
function setTab(tab){ state.tab=tab; state.action=state.action; render(); }
function startGather(skill,id){ state.action={type:'gather',skill,id,elapsed:0}; render(); }
function startCook(id){ state.action={type:'cook',id,elapsed:0}; render(); }
function startSmith(id){ state.action={type:'smith',id,elapsed:0}; render(); }
function startThieve(id){ state.action={type:'thieve',id,elapsed:0}; render(); }
function stopAction(){ state.action=null; render(); }

function setCombatStyle(style){ state.combatStyle=style; render(); }
function setZone(zoneId){
  const zone=ZONES.find(z=>z.id===zoneId);
  if(skillLevel('melee')+skillLevel('ranged')+skillLevel('magic')<zone.reqLvl*0 ) {} // no-op guard placeholder
  state.combatZone=zoneId; state.monster=null; render();
}
function engageMonster(zoneId,monId){
  const zone=ZONES.find(z=>z.id===zoneId);
  const def=zone.monsters.find(m=>m.id===monId);
  spawnMonster(def);
  render();
}
function fleeMonster(){ state.monster=null; render(); }

function equipItem(id){
  const it=ITEMS[id];
  if(!it || !it.equip) return;
  if(it.reqLvl && skillLevel(it.style)<it.reqLvl){ addLog(`Requires ${cap(it.style)} level ${it.reqLvl}.`,'bad'); render(); return; }
  state.equip[it.equip]=id;
  addLog(`Equipped ${it.name}.`,'good');
  render();
}
function unequip(slot){ state.equip[slot]=null; render(); }
function sellItem(id,qty){
  if(!invHas(id,qty)) return;
  invRemove(id,qty);
  const gained=ITEMS[id].sell*qty;
  state.gold+=gained;
  addLog(`Sold ${qty}x ${ITEMS[id].name} for ${gained} gold.`,'gold');
  render();
}
function buyShop(id){
  const s=SHOP_ITEMS.find(x=>x.id===id);
  if(!s) return;
  if(state.gold<s.price){ addLog('Not enough gold.','bad'); render(); return; }
  state.gold-=s.price;
  if(s.tool){ state.tools[s.tool]=Math.max(state.tools[s.tool],s.tier); addLog(`Purchased ${s.name}.`,'good'); }
  else { invAdd(s.item,s.qty||1); addLog(`Purchased ${s.qty||1}x ${s.item?ITEMS[s.item].name:s.name}.`,'good'); }
  render();
}

/* ============= RENDER ============= */
const root=document.getElementById('app');

function render(){
  root.innerHTML = sidebarHtml() + mainHtml() + rightbarHtml();
}

function skillRow(id,label,tabKey){
  const lvl=skillLevel(id);
  return `<button class="navbtn ${state.tab===tabKey?'active':''}" onclick="setTab('${tabKey}')">
    <span>${label}</span><span class="lvl">${lvl}</span>
  </button>`;
}

function sidebarHtml(){
  return `<div class="sidebar">
    <div class="brand">IRONVALE<small>an idle chronicle</small></div>
    <div>
      <div class="navgroup-label">Gathering & Craft</div>
      ${skillRow('fishing','Fishing','fishing')}
      ${skillRow('mining','Mining','mining')}
      ${skillRow('cooking','Cooking','cooking')}
      ${skillRow('smithing','Smithing','smithing')}
      ${skillRow('thieving','Thieving','thieving')}
    </div>
    <div>
      <div class="navgroup-label">Combat</div>
      ${skillRow('melee','Melee','combat')}
      ${skillRow('ranged','Ranged','combat')}
      ${skillRow('magic','Magic','combat')}
      ${skillRow('hitpoints','Hitpoints','combat')}
    </div>
    <div>
      <div class="navgroup-label">Town</div>
      <button class="navbtn ${state.tab==='shop'?'active':''}" onclick="setTab('shop')"><span>Shop</span></button>
      <button class="navbtn ${state.tab==='inventory'?'active':''}" onclick="setTab('inventory')"><span>Inventory</span></button>
    </div>
  </div>`;
}

function actionProgressPct(def){
  if(!state.action || getActionDef(state.action)!==def) return 0;
  return Math.min(100,(state.action.elapsed/def.time)*100);
}

function gatherPanel(skill,list,startFn,title,sub){
  const lvl=skillLevel(skill);
  const rows=list.map(def=>{
    const locked=lvl<def.reqLvl;
    const running=state.action && state.action.type==='gather' && state.action.id===def.id;
    return `<div class="action-row ${locked?'locked':''} ${running?'running':''}">
      <div>
        <div class="action-name">${def.name}</div>
        <div class="action-meta">Lvl ${def.reqLvl} · ${def.xp} xp · yields ${ITEMS[def.item].name}${running?` · owned ${state.inv[def.item]||0}`:''}</div>
        ${running?`<div class="progress-outer"><div class="progress-inner" style="width:${actionProgressPct(def)}%"></div></div>`:''}
      </div>
      ${running
        ? `<button class="action-btn stop" onclick="stopAction()">Stop</button>`
        : `<button class="action-btn" ${locked?'disabled':''} onclick="startGather('${skill}','${def.id}')">Start</button>`
      }
    </div>`;
  }).join('');
  return `<h2 class="section-title">${title}</h2><p class="section-sub">${sub}</p><div class="action-list">${rows}</div>`;
}

function cookPanel(){
  const lvl=skillLevel('cooking');
  const rows=COOK_RECIPES.map(def=>{
    const locked=lvl<def.reqLvl;
    const have=state.inv[def.raw]||0;
    const running=state.action && state.action.type==='cook' && state.action.id===def.id;
    const burnPct=Math.round(Math.max(5,(0.35-lvl*0.004-toolBonus('cooking'))*100));
    return `<div class="action-row ${locked?'locked':''} ${running?'running':''}">
      <div>
        <div class="action-name">${def.name}</div>
        <div class="action-meta">Lvl ${def.reqLvl} · ${def.xp} xp · needs ${ITEMS[def.raw].name} (have ${have}) · ~${burnPct}% burn</div>
        ${running?`<div class="progress-outer"><div class="progress-inner" style="width:${actionProgressPct(def)}%"></div></div>`:''}
      </div>
      ${running
        ? `<button class="action-btn stop" onclick="stopAction()">Stop</button>`
        : `<button class="action-btn" ${locked||have<1?'disabled':''} onclick="startCook('${def.id}')">Start</button>`
      }
    </div>`;
  }).join('');
  return `<h2 class="section-title">Cooking</h2><p class="section-sub">Turn raw catches into food that heals you in combat.</p><div class="action-list">${rows}</div>`;
}

function smithPanel(){
  const lvl=skillLevel('smithing');
  const rows=SMITH_RECIPES.map(def=>{
    const locked=lvl<def.reqLvl;
    const running=state.action && state.action.type==='smith' && state.action.id===def.id;
    const costStr=Object.entries(def.cost).map(([m,q])=>`${q}x ${ITEMS[m].name} (${state.inv[m]||0})`).join(', ');
    const canAfford=Object.entries(def.cost).every(([m,q])=>invHas(m,q));
    return `<div class="action-row ${locked?'locked':''} ${running?'running':''}">
      <div>
        <div class="action-name">${def.name}</div>
        <div class="action-meta">Lvl ${def.reqLvl} · ${def.xp} xp · needs ${costStr}</div>
        ${running?`<div class="progress-outer"><div class="progress-inner" style="width:${actionProgressPct(def)}%"></div></div>`:''}
      </div>
      ${running
        ? `<button class="action-btn stop" onclick="stopAction()">Stop</button>`
        : `<button class="action-btn" ${locked||!canAfford?'disabled':''} onclick="startSmith('${def.id}')">Start</button>`
      }
    </div>`;
  }).join('');
  return `<h2 class="section-title">Smithing</h2><p class="section-sub">Smelt ore into bars, then forge bars into weapons, armor and ammunition.</p><div class="action-list">${rows}</div>`;
}

function thievePanel(){
  const lvl=skillLevel('thieving');
  const stunned=state.action && state.action.type==='thieve' && performance.now()<state.stunUntil;
  const rows=THIEVE_TARGETS.map(def=>{
    const locked=lvl<def.reqLvl;
    const running=state.action && state.action.type==='thieve' && state.action.id===def.id;
    const stunPct=Math.round(Math.max(5,(def.stun-toolBonus('thieving'))*100));
    return `<div class="action-row ${locked?'locked':''} ${running?'running':''}">
      <div>
        <div class="action-name">${def.name}</div>
        <div class="action-meta">Lvl ${def.reqLvl} · ${def.xp} xp · ${def.goldMin}-${def.goldMax} gold · ~${stunPct}% caught</div>
        ${running?(stunned
            ?`<div class="notice warn">Caught! Recovering…</div>`
            :`<div class="progress-outer"><div class="progress-inner" style="width:${actionProgressPct(def)}%"></div></div>`)
          :''}
      </div>
      ${running
        ? `<button class="action-btn stop" onclick="stopAction()">Stop</button>`
        : `<button class="action-btn" ${locked?'disabled':''} onclick="startThieve('${def.id}')">Start</button>`
      }
    </div>`;
  }).join('');
  return `<h2 class="section-title">Thieving</h2><p class="section-sub">Pick pockets for gold. Getting caught costs you time, not health.</p><div class="action-list">${rows}</div>`;
}

function combatPanel(){
  const styles=['melee','ranged','magic'];
  const styleBtns=styles.map(s=>`<button class="style-btn ${state.combatStyle===s?'active':''}" onclick="setCombatStyle('${s}')">${cap(s)} (Lv ${skillLevel(s)})</button>`).join('');
  const totalCombat=skillLevel('melee')+skillLevel('ranged')+skillLevel('magic');
  const zoneTabs=ZONES.map(z=>{
    const locked=totalCombat<z.reqLvl;
    return `<button class="zone-tab ${state.combatZone===z.id?'active':''} ${locked?'locked':''}" ${locked?'disabled':''} onclick="setZone('${z.id}')">${z.name} <span style="color:var(--ink-dim)">(req ${z.reqLvl})</span></button>`;
  }).join('');
  const zone=ZONES.find(z=>z.id===state.combatZone);

  let fightBlock='';
  if(state.monster){
    const mon=state.monster;
    const pct=Math.max(0,Math.round((mon.curHp/mon.def.hp)*100));
    fightBlock=`<div class="monster-card fighting">
      <div style="display:flex;justify-content:space-between;">
        <b>${mon.def.name}</b>
        <button class="action-btn stop" onclick="fleeMonster()">Flee</button>
      </div>
      <div class="combatant-hp">
        <span>${mon.curHp} / ${mon.def.hp} HP</span>
        <div class="hpbar-outer"><div class="hpbar-inner" style="width:${pct}%"></div></div>
      </div>
      <div class="weak-note">Weak to <b>${cap(mon.def.weak)}</b>${mon.def.weak===state.combatStyle?' — you have the advantage!':''}</div>
    </div>`;
  } else {
    fightBlock=zone.monsters.map(m=>`<div class="monster-card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <b>${m.name}</b>
          <div class="action-meta">HP ${m.hp} · ${m.xp} xp · ${m.goldMin}-${m.goldMax} gold</div>
          <div class="weak-note">Weak to <b>${cap(m.weak)}</b></div>
        </div>
        <button class="action-btn" onclick="engageMonster('${zone.id}','${m.id}')">Fight</button>
      </div>
    </div>`).join('');
  }

  return `<h2 class="section-title">Combat</h2><p class="section-sub">Choose a style, pick a zone, and let your gear do the work.</p>
    <div class="style-toggle">${styleBtns}</div>
    <div class="zone-tabs">${zoneTabs}</div>
    <div class="action-list">${fightBlock}</div>`;
}

function shopPanel(){
  const rows=SHOP_ITEMS.map(s=>{
    const locked=s.reqLvl>1 && false; // shop items don't hard-lock browsing, just purchase feedback
    const owned = s.tool ? (state.tools[s.tool]>=s.tier) : false;
    return `<div class="shop-item">
      <div class="shop-item-name">${s.name}${owned?' <span class="tag">Owned</span>':''}</div>
      <div class="action-meta">${s.desc||('Requires lvl '+s.reqLvl)}</div>
      <div class="shop-item-price">${s.price} gold</div>
      <button class="small-btn" ${owned?'disabled':''} onclick="buyShop('${s.id}')">${owned?'Owned':'Buy'}</button>
    </div>`;
  }).join('');
  return `<h2 class="section-title">Shop</h2><p class="section-sub">Tools, ranged/magic gear and ammunition. Sell items from your Inventory tab.</p><div class="shop-grid">${rows}</div>`;
}

function inventoryPanel(){
  const entries=Object.entries(state.inv).filter(([,q])=>q>0);
  if(!entries.length) return `<h2 class="section-title">Inventory</h2><p class="section-sub">Empty. Go gather something.</p>`;
  const rows=entries.map(([id,qty])=>{
    const it=ITEMS[id];
    const equippable=it.equip?`<button class="small-btn" onclick="equipItem('${id}')">Equip</button>`:'';
    return `<div class="action-row">
      <div>
        <div class="action-name">${it.name} <span class="inv-qty">x${qty}</span></div>
        <div class="action-meta">Sell ${it.sell}g each${it.heal?` · heals ${it.heal} HP`:''}${it.dmg?` · dmg ${it.dmg}`:''}</div>
      </div>
      <div style="display:flex;gap:6px;">
        ${equippable}
        <button class="small-btn sell" onclick="sellItem('${id}',${qty})">Sell all</button>
      </div>
    </div>`;
  }).join('');
  return `<h2 class="section-title">Inventory</h2><p class="section-sub">${entries.length} item types.</p><div class="action-list">${rows}</div>`;
}

function mainHtml(){
  let body='';
  if(state.tab==='fishing') body=gatherPanel('fishing',FISHING_SPOTS,startGather,'Fishing','Cast a line and wait — cooking turns the catch into healing food.');
  else if(state.tab==='mining') body=gatherPanel('mining',MINING_NODES,startGather,'Mining','Swing a pick — smithing turns ore into gear.');
  else if(state.tab==='cooking') body=cookPanel();
  else if(state.tab==='smithing') body=smithPanel();
  else if(state.tab==='thieving') body=thievePanel();
  else if(state.tab==='combat') body=combatPanel();
  else if(state.tab==='shop') body=shopPanel();
  else if(state.tab==='inventory') body=inventoryPanel();
  return `<div class="main"><div class="card">${body}</div></div>`;
}

function equipSlotHtml(slot,label){
  const id=state.equip[slot];
  return `<div class="equip-row">
    <span class="equip-slot-name">${label}</span>
    ${id?`<span>${ITEMS[id].name} <button class="equip-item-btn" onclick="unequip('${slot}')">Remove</button></span>`:`<span style="color:var(--ink-dim)">— empty —</span>`}
  </div>`;
}

function rightbarHtml(){
  const hpPct=Math.max(0,Math.round((state.hp/state.maxHp)*100));
  const combatLvl=Math.floor((skillLevel('melee')+skillLevel('ranged')+skillLevel('magic')+skillLevel('hitpoints'))/3);
  const logHtml=state.log.slice(-40).map(l=>`<div class="entry ${l.cls}">${l.msg}</div>`).reverse().join('');
  return `<div class="rightbar">
    <div class="card">
      <div class="stat-line"><span>Hitpoints</span><b>${state.hp} / ${state.maxHp}</b></div>
      <div class="hpbar-outer"><div class="hpbar-inner" style="width:${hpPct}%"></div></div>
      <div class="stat-line" style="margin-top:8px;"><span>Gold</span><b>${state.gold}</b></div>
      <div class="stat-line"><span>Combat level</span><b>${combatLvl}</b></div>
    </div>
    <div class="card">
      <div class="section-title" style="font-size:15px;margin-bottom:8px;">Equipment</div>
      ${equipSlotHtml('weapon','Weapon')}
      ${equipSlotHtml('armor','Armor')}
      ${equipSlotHtml('ammo','Ammo/Runes')}
    </div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:160px;">
      <div class="section-title" style="font-size:15px;margin-bottom:8px;">Activity</div>
      <div class="log">${logHtml}</div>
    </div>
  </div>`;
}

render();
requestAnimationFrame(gameTick);
</script>
</body>
</html>
